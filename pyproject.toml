[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-tools"
version = "0.1.0"
description = "Utilities for processing UAV imagery"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Ian Wright" }
]
dependencies = [
  "numpy",
  "pandas>=3.0.6",
  "pillow>=12.3.0",
  "rasterio",
  "s2-tools",
  "spec-tools[plot]",
  "tifffile>=2026.9.20",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
spec-tools = { git = "https://github.com/irwright27/spec-tools.git" }
s2-tools = { path = "../s2-tools", editable = true }

[project.optional-dependencies]
sbaf = ["spec-tools>=0.1.0"]
