[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-tools"
version = "0.1.0"
description = "Utilities for processing UAV imagery"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Ian Wright" }
]
dependencies = [
  "numpy",
  "rasterio",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
sbaf = ["spec-tools>=0.1.0"]
